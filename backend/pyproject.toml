[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mu-study-hub-ai"
version = "1.0.0"
description = "AI-powered document verification bot for MU STUDY HUB"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "pypdf>=4.3",
    "pdf2image>=1.17",
    "Pillow>=10.4",
    "ollama>=0.4",
    "openai>=1.40",
    "anthropic>=0.36",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "slowapi>=0.1.9",
    "jinja2>=3.1",
    "python-magic>=0.20",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]