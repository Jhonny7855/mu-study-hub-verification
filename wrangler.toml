name = "mu-study-hub-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
account_id = ""
workers_dev = true
route = ""
zone_id = ""

[[kv_namespaces]]
binding = "CACHE"
id = ""

[[d1_databases]]
binding = "DB"
database_name = "mu-study-hub"
database_id = ""

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "mu-study-hub-uploads"

[vars]
GROQ_API_KEY = ""
GROQ_API_URL = "https://api.groq.com/v1/chat/completions"
GROQ_MODEL = "llama-3.1-70b-sonnet"
GROQ_TEMPERATURE = "0.0"
GROQ_MAX_TOKENS = "512"
DATABASE_URL = "sqlite:///./mu_study_hub.db"
STORAGE_MAX_BYTES = "52428800"
OCR_ENABLED = "true"

[triggers]
crons = []

[env.production]
route = "api.mustudyhub.education"
workers_dev = false

[env.staging]
workers_dev = true
